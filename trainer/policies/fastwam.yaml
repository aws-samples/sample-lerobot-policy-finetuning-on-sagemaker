# Registry entry: FastWAM (Wan2.2-TI2V-5B video expert + action DiT, mixture-of-transformers), lerobot 0.6.1 policy type "fastwam".
# Maintainer-owned facts. Users choose and configure policies in the repo-root project_config.json, never here.
name: fastwam
display_name: FastWAM (Wan2.2 world-action model)
tier: 2
status: smoke-tested     # 200-step smoke passed 2026-09-15 on an 80 GB H100 (offline on an EC2 p5.4xlarge with the same container contract as the SageMaker job; docs/RESULTS.md)
deliverable: false
lerobot_type: fastwam
precision: fp32_masters_bf16_autocast   # config default torch_dtype=bfloat16 hard-casts both DiT experts; fp32 masters + amp_driver.py autocast
base_checkpoint: lerobot/fastwam_base   # 6.02B params; auto-selected as pretrained_path by the config when the DiT shapes match (configuration_fastwam.py:263-268)
hub_artifacts:               # frozen Wan pieces are excluded from model.safetensors and fetched by name at __init__ (wan/components.py:115,132; :83)
  - {repo: lerobot/fastwam_base, revision: 0a868ec1dcf6ff00bcdfa9b7196d6e211ed7e616, role: base_checkpoint, gated: false}   # pinned 2026-09-23 (HF API)  # pragma: allowlist secret
  - {repo: Wan-AI/Wan2.2-TI2V-5B-Diffusers, revision: b8fff7315c768468a5333511427288870b2e9635, role: frozen_vae_and_umt5_text_encoder, gated: false}   # pinned 2026-09-23 (HF API); repo id hard-coded for the VAE  # pragma: allowlist secret
  - {repo: google/umt5-xxl, revision: 66cb9e7e85526fe440a945569e42c72fb6cbc0ad, role: tokenizer, gated: false}   # pinned 2026-09-23 (HF API)  # pragma: allowlist secret
requires_flat_action_names: false
camera_count_divides: 448           # set_dataset_feature_metadata gives each camera 448 // n px and validate_features requires the widths to sum to 448: 1, 2, 4, 7, 8 cameras work, 3 do not (use policies.fastwam.cameras)
requires_language: true             # conditions on the dataset task string (compat check: 0 tasks = blocked, 1 task = constant language)
camera_mapping_required: false  # set_dataset_feature_metadata rebuilds the visual features from the dataset keys (sorted; width 448 split across cameras)
smoke_candidate: false
stub_reason: null            # promoted 2026-09-15: 2.25 steps/s at batch 1, 73 GB peak, ~31 GB per checkpoint (measured, see hardware.checkpoint_gb); NEEDS an 80 GB GPU

licence:
  class: unknown             # clean | terms | research_only | non_commercial | none | unknown | blocked
  spdx: Apache-2.0           # HF tags: lerobot/fastwam_base, Wan-AI/Wan2.2-TI2V-5B(-Diffusers), google/umt5-xxl all apache-2.0; corpus terms not verified
  url: https://huggingface.co/lerobot/fastwam_base
  commercial_use: "unknown"
  weights_fetched_by: job
  gated: false
  requires_accept: true
  requires_approval: true    # unknown corpus: record who read the instrument before any job is submitted
  verified_on: "2026-09-10"
  notice: >-
    lerobot/fastwam_base, and the frozen Wan2.2-TI2V-5B VAE, UMT5-XXL encoder and tokenizer it pulls at run time, are
    all tagged apache-2.0 on the Hub. No licence text and no statement about the robot training data were found for
    the base checkpoint, so nobody has been able to check the publisher's terms. Treat the licence as unresolved and
    check it yourself before relying on a fine-tune of this base.

hardware:
  vram_gb: 73                # MEASURED 2026-09-15 on an 80 GB H100 (batch 1, chunk 30): nvidia-smi peak 72.8 GB, torch 67.4 GB
  min_gpu_memory_gb: 80
  checkpoint_gb: 31            # MEASURED 2026-09-15 (20k-step run): 23 GB fp32 weights + 7.7 GB optimizer state (action expert only)
  hub_gb: 46                 # staged hub channel size (0 = nothing staged)
  instance_types: [ml.p5.4xlarge, ml.p4de.24xlarge, ml.p5.48xlarge]
  step_rate:
    H100: 2.25             # measured 2026-09-15 on an 80 GB H100 (EC2 p5.4xlarge, same container contract as the SageMaker job, run offline): 0.44 s/step at batch 1 (docs/RESULTS.md)

defaults:
  steps: 20000               # UNVERIFIED; no single-GPU recipe published
  batch_size: 1              # 9 video frames (33-frame window, stride 4) per camera through the VAE per sample
  chunk: 32                  # action_horizon; must be a multiple of the 8 video transitions ((33-1)/4) -> 32 is the only default-compatible value
  save_freq: 5000
  log_freq: 200
  seed: 1000

train:
  argv:
    - --dataset.repo_id=${REPO_ID}
    - --dataset.root=${DS_ROOT}
    - --dataset.episodes=${TRAIN_EPS}
    - --policy.type=fastwam                            # base weights load via base_model_id auto-path; shape-mismatched action/proprio tensors are re-initialised (modeling_fastwam.py:92-134)
    - --policy.torch_dtype=float32                     # fp32 masters; fp32_attention=true is already the default
    - --policy.freeze_video_expert=true                # the 5B Wan video expert keeps pretrained weights; only action expert + proprio encoder train
    - --policy.loss={"lambda_video":0.0,"lambda_action":1.0}   # skip the gradient-free video loss once the video expert is frozen (config docstring)
    - --policy.device=${DEVICE}
    - --policy.push_to_hub=false
    - --batch_size=${BATCH}
    - --steps=${STEPS}
    - --save_freq=${SAVE_FREQ}
    - --log_freq=${LOG_FREQ}
    - --num_workers=${NUM_WORKERS}
    - --seed=${SEED}
    - --output_dir=${LR_OUT}
    - --job_name=${JOB_NAME}
    - --wandb.enable=false
  optional_argv:
    - when: VIDEO_BACKEND
      arg: "--dataset.video_backend=${VIDEO_BACKEND}"
      after: "--dataset.episodes"
    - when: ACTION_DIM                                  # validate_features requires action_dim == dataset action width (default 7, LIBERO)
      arg: "--policy.action_dim=${ACTION_DIM}"
      after: "--policy.type"
    - when: STATE_DIM                                   # proprio_dim must equal observation.state width (default 8, LIBERO)
      arg: "--policy.proprio_dim=${STATE_DIM}"
      after: "--policy.type"
  scheduler: none            # get_scheduler_preset returns None: constant LR 1e-4, 'extend' adds only --steps
  forbidden_flags:
    - --dataset.video_backend=torchcodec
    - --policy.torch_dtype=bfloat16          # hard-casts weights; AdamW updates vanish below the bf16 ULP (see docs/TRAPS.md)
    - --policy.torch_dtype=float16
    - --policy.model_id                      # only Wan-AI/Wan2.2-TI2V-5B or a local path is accepted (configuration_fastwam.py:129-132)
    - --rename_map

eval:
  policy_arg: fastwam
  n_samples: 1               # one draw per frame; inference_seed=42 fixes the flow-matching noise for THIS recipe: the 2026-09-21 p5 smoke
                             # reloaded the published checkpoint with max_abs_diff_vs_eval 0.0 (the LoRA recipe does not, see fastwam_lora.yaml)
  history_frames: 1          # inference consumes the current frame per camera; the 9-frame window (range(0,33,4)) is a training target only
  no_history: true           # inference takes the current frame only: proprio must be [D] or [1, D], not the 9-frame training window (H100 run 2026-09-15)

smoke:
  steps: 200
  checks_device: cpu         # rebuilding the fp32 6B policy on the GPU after training OOMs an 80 GB card (frozen Wan expert + VAE + UMT5)
  max_minutes: 150
  log_freq: 50

serving:
  frames_per_camera: 1
  action_space: dataset action space (ACTION MEAN_STD), action_horizon 32 at dataset fps
  control_rate: dataset fps
  notes: >-
    Language-conditioned through the UMT5 prompt_template. Cameras are resized to 224 x (448 / n_cameras) inside the
    model. predict_action_chunk returns 32 steps.
